apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: my-app-tls
  namespace: my-namespace
spec:
  secretName: my-app-tls
  dnsNames: [my-app.internal.domain]
  usages: [digital signature, key encipherment, server auth]
  issuerRef:
    name: <vault-issuer>
    kind: ClusterIssuer        # or Issuer


# 1. The failed Helm revision and its error
helm history gateway-api -n <namespace>          # find it with: helm list -A | grep gateway-api

# 2. The rule currently enforced: should show 'v1.[0-5]', i.e. the 1.6.2 policy
kubectl get validatingadmissionpolicy safe-upgrades.gateway.networking.k8s.io \
  -o jsonpath='{.spec.validations[1].expression}{"\n"}'

# 3. CRD versions on the cluster: all should be v1.6.2
kubectl get crd -o custom-columns='NAME:.metadata.name,BUNDLE:.metadata.annotations.gateway\.networking\.k8s\.io/bundle-version' | grep gateway.networking

# 4. Reproduce the block without changing anything
kubectl annotate crd gateways.gateway.networking.k8s.io \
  gateway.networking.k8s.io/bundle-version=v1.5.1 --overwrite --dry-run=server   # expect: denied by safe-upgrades
kubectl annotate crd gateways.gateway.networking.k8s.io \
  gateway.networking.k8s.io/bundle-version=v1.6.3 --overwrite --dry-run=server   # expect: allowed

